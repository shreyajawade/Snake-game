<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 20px;
            margin-bottom: 15px;
        }

        canvas {
            background: #222;
            border: 3px solid #555;
            display: block;
            margin: auto;
        }

        .buttons {
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        #startBtn {
            background: #28a745;
            color: white;
        }

        #pauseBtn {
            background: #ffc107;
            color: black;
        }

        #restartBtn {
            background: #dc3545;
            color: white;
        }

        .instructions {
            margin-top: 15px;
            color: #bbb;
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake Game</h1>

    <div class="score-board">
        Score: <span id="score">0</span>
        &nbsp;&nbsp;|&nbsp;&nbsp;
        High Score: <span id="highScore">0</span>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="buttons">
        <button id="startBtn">Start Game</button>
        <button id="pauseBtn">Pause</button>
        <button id="restartBtn">Restart</button>
    </div>

    <div class="instructions">
        Use ⬆️ ⬇️ ⬅️ ➡️ arrow keys to control the snake
    </div>

</div>


<script>

    // Get HTML elements
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreDisplay = document.getElementById("score");
    const highScoreDisplay = document.getElementById("highScore");

    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const restartBtn = document.getElementById("restartBtn");


    // Game settings
    const gridSize = 25;
    const tileCount = canvas.width / gridSize;

    let snake;
    let food;
    let watermelon = null;
    let applesEaten = 0;

    let dx;
    let dy;

    let score = 0;
    let highScore = localStorage.getItem("snakeHighScore") || 0;

    let gameRunning = false;
    let gamePaused = false;
    let gameLoop;


    highScoreDisplay.textContent = highScore;


    // Start a new game
    function startGame() {

        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];

        dx = 1;
        dy = 0;

        score = 0;

        scoreDisplay.textContent = score;

        gamePaused = false;
        pauseBtn.textContent = "Pause";

        createFood();
        watermelon = null;
        applesEaten = 0;

        gameRunning = true;

        clearInterval(gameLoop);

        gameLoop = setInterval(updateGame, 100);
    }


   // Create apple at random position
function createFood() {

    food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };

    // Make sure apple does not appear inside snake
    for (let part of snake) {

        if (part.x === food.x && part.y === food.y) {
            createFood();
            return;
        }
    }
}


// Create watermelon at random position
function createWatermelon() {

    watermelon = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };

    // Make sure watermelon does not appear inside snake or on apple
    for (let part of snake) {

        if (part.x === watermelon.x && part.y === watermelon.y) {
            createWatermelon();
            return;
        }
    }

    if (
        watermelon.x === food.x &&
        watermelon.y === food.y
    ) {
        createWatermelon();
        return;
    }
}


    // Update game
    function updateGame() {

        // Stop updating when game is paused
        if (!gameRunning || gamePaused) {
    return;
}
        

        const head = {
            x: snake[0].x + dx,
            y: snake[0].y + dy
        };


        // Check wall collision
        if (
            head.x < 0 ||
            head.x >= tileCount ||
            head.y < 0 ||
            head.y >= tileCount
        ) {

            gameOver();
            return;
        }


        // Check collision with snake body
        for (let i = 0; i < snake.length; i++) {

            if (
                head.x === snake[i].x &&
                head.y === snake[i].y
            ) {

                gameOver();
                return;
            }
        }


        // Add new head
        snake.unshift(head);


        // Check if snake ate food
        if (
            head.x === food.x &&
            head.y === food.y
        ) {

            score++;
applesEaten++;

if (applesEaten % 5 === 0 && watermelon === null) {
    createWatermelon();
}

            scoreDisplay.textContent = score;

            if (score > highScore) {

                highScore = score;

                highScoreDisplay.textContent = highScore;

                localStorage.setItem(
                    "snakeHighScore",
                    highScore
                );
            }

            createFood();
} else if (
    watermelon !== null &&
    head.x === watermelon.x &&
    head.y === watermelon.y
) {

    // Snake ate watermelon
    score++;

    scoreDisplay.textContent = score;

    // Remove watermelon
    watermelon = null;

} else {

    // Remove tail if no food was eaten
    snake.pop();
}

        drawGame();
    }


    // Draw everything
    function drawGame() {

        // Clear canvas
        ctx.fillStyle = "#222";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Draw grid
        ctx.strokeStyle = "#333";

        for (let i = 0; i <= tileCount; i++) {

            ctx.beginPath();

            ctx.moveTo(i * gridSize, 0);

            ctx.lineTo(
                i * gridSize,
                canvas.height
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(0, i * gridSize);

            ctx.lineTo(
                canvas.width,
                i * gridSize
            );

            ctx.stroke();
        }


        // Draw apple 🍎
        ctx.font = "23px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            "🍎",
            food.x * gridSize + gridSize / 2,
            food.y * gridSize + gridSize / 2
        );

// Draw watermelon 🍉 if it exists
if (watermelon !== null) {

    ctx.fillText(
        "🍉",
        watermelon.x * gridSize + gridSize / 2,
        watermelon.y * gridSize + gridSize / 2
    );
}

        // Draw snake
        snake.forEach((part, index) => {

            if (index === 0) {
                ctx.fillStyle = "#00ff66";
            } else {
                ctx.fillStyle = "#00cc55";
            }

            ctx.fillRect(
                part.x * gridSize + 1,
                part.y * gridSize + 1,
                gridSize - 2,
                gridSize - 2
            );
        });


        // Draw eyes on snake head
        const head = snake[0];

        ctx.fillStyle = "red";


        if (dx === 1) {

            // Moving right
            ctx.beginPath();

            ctx.arc(
                head.x * gridSize + 17,
                head.y * gridSize + 7,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
                head.x * gridSize + 17,
                head.y * gridSize + 18,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();


        } else if (dx === -1) {

            // Moving left
            ctx.beginPath();

            ctx.arc(
                head.x * gridSize + 8,
                head.y * gridSize + 7,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
                head.x * gridSize + 8,
                head.y * gridSize + 18,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();


        } else if (dy === -1) {

            // Moving up
            ctx.beginPath();

            ctx.arc(
                head.x * gridSize + 7,
                head.y * gridSize + 8,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
                head.x * gridSize + 18,
                head.y * gridSize + 8,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();


        } else if (dy === 1) {

            // Moving down
            ctx.beginPath();

            ctx.arc(
                head.x * gridSize + 7,
                head.y * gridSize + 17,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
                head.x * gridSize + 18,
                head.y * gridSize + 17,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
// 👅 White forked tongue
const centerX = head.x * gridSize + gridSize / 2;
const centerY = head.y * gridSize + gridSize / 2;

ctx.strokeStyle = "white";
ctx.lineWidth = 2;
ctx.lineCap = "round";

ctx.beginPath();

if (dx > 0) {
    // Right
    ctx.moveTo(centerX + 6, centerY);
    ctx.lineTo(centerX + 13, centerY);

    ctx.moveTo(centerX + 13, centerY);
    ctx.lineTo(centerX + 16, centerY - 3);

    ctx.moveTo(centerX + 13, centerY);
    ctx.lineTo(centerX + 16, centerY + 3);

} else if (dx < 0) {
    // Left
    ctx.moveTo(centerX - 6, centerY);
    ctx.lineTo(centerX - 13, centerY);

    ctx.moveTo(centerX - 13, centerY);
    ctx.lineTo(centerX - 16, centerY - 3);

    ctx.moveTo(centerX - 13, centerY);
    ctx.lineTo(centerX - 16, centerY + 3);

} else if (dy > 0) {
    // Down
    ctx.moveTo(centerX, centerY + 6);
    ctx.lineTo(centerX, centerY + 13);

    ctx.moveTo(centerX, centerY + 13);
    ctx.lineTo(centerX - 3, centerY + 16);

    ctx.moveTo(centerX, centerY + 13);
    ctx.lineTo(centerX + 3, centerY + 16);

} else if (dy < 0) {
    // Up
    ctx.moveTo(centerX, centerY - 6);
    ctx.lineTo(centerX, centerY - 13);

    ctx.moveTo(centerX, centerY - 13);
    ctx.lineTo(centerX - 3, centerY - 16);

    ctx.moveTo(centerX, centerY - 13);
    ctx.lineTo(centerX + 3, centerY - 16);
}

ctx.stroke();
    }


    // Game over
    function gameOver() {

        gameRunning = false;

        gamePaused = false;

        clearInterval(gameLoop);

        pauseBtn.textContent = "Pause";


        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle = "white";

        ctx.font = "40px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "GAME OVER",
            canvas.width / 2,
            canvas.height / 2
        );


        ctx.font = "20px Arial";

        ctx.fillText(
            "Click Restart to play again",
            canvas.width / 2,
            canvas.height / 2 + 40
        );
    }


    // Keyboard controls
    document.addEventListener("keydown", function(event) {

        if (!gameRunning || gamePaused) {
            return;
        }


        // Prevent opposite direction
        if (event.key === "ArrowUp" && dy !== 1) {

            dx = 0;
            dy = -1;

        } else if (event.key === "ArrowDown" && dy !== -1) {

            dx = 0;
            dy = 1;

        } else if (event.key === "ArrowLeft" && dx !== 1) {

            dx = -1;
            dy = 0;

        } else if (event.key === "ArrowRight" && dx !== -1) {

            dx = 1;
            dy = 0;
        }
    });


    // Start button
    startBtn.addEventListener("click", function() {

        if (!gameRunning) {
            startGame();
        }

    });


    // Pause / Resume button
pauseBtn.addEventListener("click", function() {

    if (!gameRunning) {
        return;
    }

    gamePaused = !gamePaused;

    if (gamePaused) {

        // Just pause the game
        pauseBtn.textContent = "Resume";

    } else {

        // Resume the game
        pauseBtn.textContent = "Pause";

        drawGame();
    }

});


    // Restart button
    restartBtn.addEventListener("click", function() {

        startGame();

    });


    // Initial screen
    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    dx = 1;
    dy = 0;

    createFood();

    drawGame();

</script>

</body>
</html>
